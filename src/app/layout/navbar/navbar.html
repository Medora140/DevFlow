<header class="topbar">
  <div class="breadcrumb">
    <span>Workspace</span>
    <span class="seperator">/</span>
    <strong>
      {{pageTitle()}}
    </strong>
  </div>
  <div class="topbar-actions">
    <form (submit)="searchTasks($event)" class="search-box">
      <span aria-hidden="true">⌕</span> 
      <!-- ignore element while keeping it on the screen -->
       <input type="search" placeholder="Search tasks" [value]="searchTerm()" (input)="searchTerm.set($any($event.target).value)">

       <button type="submit">Search</button>
    </form>
  </div>
</header>
