<aside class="sidebar">
  <a class="brand" routerLink="/dashboard">
    <span class="brand-mark"> D </span>
    <span>DevFlow</span>
    <span class="brand-badge">BETA</span>
  </a>

  <div class="workspace">
    <div class="workspace-avatar">D</div>
    <div class="workspace-info">
      <strong>DevFlow Studio</strong>
      <span>Free workspace</span>
    </div>
  </div>
  <p class="nav-label">WORKSPACE</p>
  <nav class="navigation">
    <a
      routerLink="/dashboard"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <span class="nav-icon">◫</span>
      <span> Dashboard </span>
    </a>
    <a routerLink="/projects" routerLinkActive="active">
      <span class="nav-icon">▧</span>
      <span>Projects</span>
    </a>
    <a routerLink="/tasks" routerLinkActive="active">
      <span class="nav-icon">☷</span>
      <span>My Tasks</span>
    </a>
    <a routerLink="/team" routerLinkActive="active">
      <span class="nav-icon">♧</span>
      <span>Team</span>
    </a>
  </nav>
  <div class="sidebar-bottom">
    <p class="nav-label">PREFERENCES</p>
    <nav class="navigation">
      <a routerLink="/settings" routerLinkActive="active">
        <span class="nav-icon">⚙</span>
        <span>Settings</span>
      </a>
    </nav>
    <div class="profile">
      <div class="profile-avatar">
        {{ auth.currentUser()?.name?.charAt(0) ?? ':)' }}
      </div>
      <div class="profile-info">
        <strong>
          {{ auth.currentUser()?.name ?? 'Guest' }}
        </strong>
        <span>
          {{ auth.currentUser()?.email ?? '' }}
        </span>
      </div>
      <button class="sign-out" type="button" (click)="signOut()">Sign out</button>
    </div>
  </div>
</aside>
