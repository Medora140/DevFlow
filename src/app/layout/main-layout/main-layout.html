<div class="app-shell">
  @if (isNavigationOpen()) {
    <button
      class="sidebar-backdrop"
      type="button"
      aria-label="Close navigation"
      (click)="closeNavigation()"
    ></button>
  }
  <app-sidebar [isOpen]="isNavigationOpen()" (closed)="closeNavigation()" />
  <div class="main-area">
    <app-navbar [navigationOpen]="isNavigationOpen()" (navigationToggle)="toggleNavigation()" />
    <main class="page-content">
      <router-outlet />
    </main>
  </div>
</div>
